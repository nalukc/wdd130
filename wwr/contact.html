<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>O'opu White Water Rafting Site | Contact Us</title>
  <meta name="description"
    content="The Contact us page of the white water rafting company. Detailing how to contact the organization and it's address">
  <meta name="author" content="Nalu K. Carvalho">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <img src="images/oopu_logo.png" alt="O'opu White Water Rafting Logo">
    <nav>
      <ul class="navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
      </ul>
    </nav>
  </header>

  <main>
    <div class="contact-info">
      <h1>O'opu Whitewater Rafting</h1>
      <h2>
        <span>1772 Kealakekua Road.</span>
        <span>Kealakekua Bay, Hawaii</span>
        <span>+1 808 555 1810</span>
        <span>oopuinfo@aol.com</span>
      </h2>
    </div>
    <div class="form-section">
      <iframe class="maps"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15046.053433880053!2d-155.93764924872903!3d19.4765374089934!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x795401473092cc1b%3A0xd2150eebe84ada59!2sKealakekua%20Bay!5e0!3m2!1sen!2sus!4v1771127167733!5m2!1sen!2sus"
        width="430" height="500"  allowfullscreen="" loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"></iframe>
      
        <form class="form">
        <div class="form-group">
          <label for="name"><strong>Name</strong></label>
          <input type="text" id="name" name="name" placeholder="James Cook"></label>
        </div>

        <div class="form-group">
          <label for="email"><strong>Email</strong></label>
          <input type="text" id="email" name="email" placeholder="kalaniopuu@gmail.com"></label>
        </div>

        <div class="form-group">
          <fieldset>
            <legend><strong>Message Purpose</strong></legend>
            <label>
              <input type="radio" name="purpose" value="General Inquiry">
              General Inquiry
            </label>
            <label>
              <input type="radio" name="purpose" value="Reservation Question">
              Reservation Question
            </label>
            <label>
              <input type="radio" name="purpose" value="Website Suggestion">
              Website Question
            </label>
          </fieldset>
        </div>

        <div class="form-group">
          <label for="Message"><strong>Message</strong>
            <textarea id="message" name="message" placeholder="Type Here"></textarea>
        </div>

        <div class="form-group">
          <label class="subscribe">
            <input type="checkbox" name="subscribe" value="subscribe"><strong>Please Subscribe me to the monthly newsletter</strong>
          </label>
        </div>

        <button type="submit">Get in Touch!</button>
      </form>
    </div>
      <section class="employees">
        <h2>We Are Here to Serve You</h2>
        <figure>
          <img src="images/tama-ku-profile.jpg" alt="Tama Ku, adventure coordinator of O'opu White Water Rafting">
          <figcaption>Our Adventure Coordinator. Tama Ku.</figcaption>
        </figure>
        <figure>
          <img src="images/mele-reef-profile.jpg" alt="Mele Reef, owner of O'opu White Water Rafting">
          <figcaption>Our Owner. The big fish Mele Reef</figcaption>
        </figure>
        <figure>
          <img src="images/iaka-blaque-profile.jpg" alt="Iaka Blaque, chief of safety and guest experience">
          <figcaption>Iaka Blaque, our Safety and Guest Experience Chief</figcaption>
        </figure>
      </section>

  </main>
  <footer>
    <p>©️2026 🩹 O'opu Whitewater Rafting 🩹 Nalu K Carvalho</p>
    <nav class="socialmedia">
      <a href="https://www.facebook.com/">
        <img src="images/facebook-icon.png" alt="Facebook">
      </a>
      <a href="https://www.instagram.com/">
        <img src="images/instagram-icon.png" alt="Instagram">
      </a>
      <a href="https://x.com/">
        <img src="images/twitter-icon.png" alt="Twitter">
      </a>
    </nav>
  </footer>
</body>



</html>
